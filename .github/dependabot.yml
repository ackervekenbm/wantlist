version: 2
updates:
  - package-ecosystem: npm
    directory: /
    assignees:
      - ackervekenbm
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns:
          - '*'
    ignore:
      # TypeScript majors can outrun typescript-eslint's peer range and leave
      # the weekly group uninstallable. We still want 5.x patches, so block
      # only the major. Revisit when
      # typescript-eslint supports the new major.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
  - package-ecosystem: github-actions
    directory: /
    assignees:
      - ackervekenbm
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  # The Dockerfile's base image is pinned by digest; this keeps it patched.
  # Majors (Node 24) are a deliberate move, not a weekly bump.
  - package-ecosystem: docker
    directory: /
    assignees:
      - ackervekenbm
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'
