# Runs the published image on any Docker host: put a .env with the keys next
# to this file (see .env.example), then `docker compose up -d`. Settings and the
# OpenMediaVault route: docs/deployment.md.
services:
  wantlist:
    image: ghcr.io/ackervekenbm/wantlist:latest
    ports:
      - "8091:3000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      SERPER_API_KEY: ${SERPER_API_KEY:?set SERPER_API_KEY in .env}
      # Optional: blank uses the app's default (docs/deployment.md#settings).
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      MODEL_CHAIN: ${MODEL_CHAIN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-}
      WORKER_QUEUE_CAP: ${WORKER_QUEUE_CAP:-}
    volumes:
      - wantlist-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  wantlist-data:
