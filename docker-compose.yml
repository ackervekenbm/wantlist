# Runs the published image on any Docker host: put a .env with the keys next
# to this file (see .env.example), then `docker compose up -d`. Settings and the
# OpenMediaVault route: docs/deployment.md.
services:
  wantlist:
    image: ghcr.io/ackervekenbm/wantlist:latest
    ports:
      - "8091:3000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      SERPER_API_KEY: ${SERPER_API_KEY:?set SERPER_API_KEY in .env}
      # Optional settings: each shows its default (docs/deployment.md#settings).
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      MODEL_CHAIN: ${MODEL_CHAIN:-gemini-3.8-flash,gemini-3.5-flash,gemini-3.1-flash-lite}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-900000}
      WORKER_QUEUE_CAP: ${WORKER_QUEUE_CAP:-3}
    volumes:
      - wantlist-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  wantlist-data:
